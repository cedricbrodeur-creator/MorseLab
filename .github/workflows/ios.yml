name: Build iOS
# Compile l'app iPhone sur un Mac GitHub et produit un .ipa NON signé.
# Pour l'installer : le signer avec votre identifiant Apple via Sideloadly ou AltStore.
on:
  push:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: npm install
      - run: npx cap sync ios
      - name: Compiler (sans signature)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empaqueter l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr MorseLab-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MorseLab-ios-unsigned-ipa
          path: MorseLab-unsigned.ipa
